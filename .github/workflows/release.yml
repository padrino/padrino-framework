# Publishes a release to rubygems.org. Two ways to start it:
# - "Run workflow" (workflow_dispatch) on master or an X.Y-stable branch with the version, e.g. 0.18.0.
#   The version files on that branch must already say it (merge the bump first). The workflow creates
#   the tag itself, on the built commit, once the release is approved.
# - Pushing a version tag (e.g. 0.18.0) on a commit of master or an X.Y-stable branch.
#
# 1. "build" (no credentials) checks the version against the version files and the branch, builds the
#    nine gems in release order and uploads them, with their sha256 sums, as an artifact. Check those
#    files before approving: they are exactly what "publish" pushes.
# 2. "publish" runs in the "release" environment. It first refuses if the tag exists somewhere else
#    (or, for a tag push, has moved since this run started), checks the sums, creates the tag if this
#    run was dispatched, then exchanges this run's OIDC identity for short-lived RubyGems tokens (trusted
#    publishing: no API key is stored anywhere) and pushes each gem that isn't on rubygems.org yet;
#    "Re-run failed jobs" resumes a release that stopped partway.
#
# The "release" environment's protection rules are the ONLY gate on publishing: RubyGems trusts any run
# of a release.yml in this repository that uses that environment, whatever the ref, so a tag or branch
# can carry its own copy of this file. Set the environment up (required reviewer, no admin bypass,
# deployments only from version tags, master and the X.Y-stable branches) BEFORE adding the trusted
# publishers on rubygems.org.
#
# Prerelease versions (0.19.0.rc1) are refused, and a stable branch needs this file on it before it can
# use it; release those with rake bump / rake publish. A tag pushed by rake publish also starts a run
# here: reject its "release" deployment.
name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (already in the version files of this branch), e.g. 0.18.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'padrino/padrino-framework'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.3'
      - name: Check the version
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$version' is not a version like 1.2.3"; exit 1; }
            case "$GITHUB_REF" in
              refs/heads/master|"refs/heads/${version%.*}-stable") ;;
              *) echo "::error::run this on master or ${version%.*}-stable, not $GITHUB_REF"; exit 1 ;;
            esac
            tagged=$(git ls-remote origin "refs/tags/$version" "refs/tags/$version^{}" | cut -f1)
            [ -z "$tagged" ] || echo "$tagged" | grep -qx "$GITHUB_SHA" ||
              { echo "::error::tag $version already exists at another commit"; exit 1; }
          else
            version="$GITHUB_REF_NAME"
          fi
          core=$(ruby -e 'puts File.read("padrino-core/lib/padrino-core/version.rb")[/VERSION = .([^\x27"]+)/, 1]')
          perf=$(ruby -e 'puts File.read("padrino-performance/lib/padrino-performance/version.rb")[/VERSION = .([^\x27"]+)/, 1]')
          [ "$version" = "$core" ] && [ "$version" = "$perf" ] || { echo "::error::version $version but version files say $core / $perf"; exit 1; }
          series="${version%.*}-stable"
          on=""
          for b in master "$series"; do
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/$b" 2>/dev/null && on="$b"
          done
          [ -n "$on" ] || { echo "::error::$version ($GITHUB_SHA) is not on master or $series"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$version ($GITHUB_SHA) is on $on"
      - name: Build the gems
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          mkdir dist
          ruby -e 'require "./padrino/subgems"; puts PADRINO_GEMS.keys' > dist/ORDER
          while read -r g; do
            (cd "$g" && gem build "$g.gemspec" --output "../dist/$g-$VERSION.gem")
          done < dist/ORDER
          (cd dist && sha256sum *.gem > SHA256SUMS && cat ORDER SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gems-${{ steps.check.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # to create the tag on a dispatched release
      id-token: write
    steps:
      - name: Refuse a stale run (the tag is somewhere else)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tagged=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$VERSION*" |
            awk -v t="refs/tags/$VERSION" '$2 == t || $2 == t "^{}" { print $1 }')
          if [ -z "$tagged" ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "tag $VERSION will be created at $GITHUB_SHA"
          else
            echo "$tagged" | grep -qx "$GITHUB_SHA" || { echo "::error::tag $VERSION is not at $GITHUB_SHA (now: ${tagged:-gone}); this run is stale"; exit 1; }
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gems-${{ needs.build.outputs.version }}
          path: dist
      - name: Check the sums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists (checked above that it is at $GITHUB_SHA)"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA"
          fi
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.3'
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push the gems
        working-directory: dist
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          while read -r g; do
            if curl -fsS "https://rubygems.org/api/v1/versions/$g.json" | ruby -rjson -e 'exit(JSON.parse($stdin.read).any? { |v| v["number"] == ENV["VERSION"] } ? 0 : 1)'; then
              echo "$g $VERSION is already on rubygems.org; skipping"
            else
              gem push "$g-$VERSION.gem" </dev/null
            fi
          done < ORDER
