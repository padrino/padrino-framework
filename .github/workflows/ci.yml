name: CI
on: [push, pull_request]

jobs:
  test:
    # Pushes to this repo already run CI, so only run pull_request events for PRs from forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ['2.7', '3.0', '3.1', '3.2', '3.3', '3.4', 'jruby', '4.0']
        haml_version: ['5', '7']
        exclude:
          - ruby: '2.7'
            haml_version: '7'
          - ruby: '3.0'
            haml_version: '7'
          - ruby: '3.1'
            haml_version: '7'
          - ruby: '4.0'
            haml_version: '5'
        include:
          # HAML 6 is what Ruby 2.7 to 3.1 apps get without a pin (haml 7 needs Ruby 3.2)
          - os: ubuntu-latest
            ruby: '3.1'
            haml_version: '6'
    runs-on: ${{ matrix.os }}
    env:
      HAML_VERSION: ${{ matrix.haml_version }}
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rake test

  frozen-string-literals:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      HAML_VERSION: '7'
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: true
    - run: bundle exec rake test
      env:
        RUBYOPT: --enable-frozen-string-literal
